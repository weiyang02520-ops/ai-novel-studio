[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-novel-studio"
version = "0.1.0"
description = "个人版 AI 小说创作软件(本地优先, 自带 API Key)"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["core*", "agents*", "llm*", "tools*", "adapters*"]
